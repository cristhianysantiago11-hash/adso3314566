<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26-border-radius</title>
    <link rel="stylesheet" href="estylos.css">
    <style>
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .figura {
            width: 150px;
            height: 150px;
            background: #131313;
            margin: 20px;
        }

        .redondo {
            border-radius: 50%;
        }

        .pildora {
            border-radius: 75px;
        }

        .esquina-dif {
            border-radius: 0 50px 0 50px;
        }

        .rombo {
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
    </style>

<body>
    <main>

                    </path>
                </svg>

        </div>
        <br><br>

        <header>

</body>
