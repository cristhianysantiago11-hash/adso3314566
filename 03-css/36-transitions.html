<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <link rel="stylesheet" href="estylos.css">

    <style> 
        section img {
            display: block;
            margin: 1rem auto;
        }
        div.box {
            background-color: #000c;
            margin: 1rem auto;
            width: 200px;
            height: 200px;
        }
        /* ********* */
        img.trans1 {
            transition: transform 0.5s ease-in;
        }
        img.trans1:hover {
            transform: scale(1.4);
        }
        /* ********* */
        img.trans2 {
            transition: transform 1s ease-out;
        }
        img.trans2:hover {
            transform: rotate(-180deg);
        }
        /* ********* */
        img.trans3 {
            transition: all 1s ease-in-out;
        }
        img.trans3:hover {
            transform: rotateY(180deg);
        }
        /* ********* */
        img.trans4 {
            transition: all 0.5s linear;           
        }
        img.trans4:hover {
            transform: translateX(100px);
        }
        /* ********* */
        img.trans5 {
            transition: all 0.5s linear;   /*  El ejemplo 5: Es resolver algo por nosotros  */
        }
        img.trans5:hover {
            transform: rotateX(360deg);          
        } 
        /* ********* */                  /*  Caja hecha por el profe ofac  */          
        div.box {
            transition: width 1s, 
                        height 1s 1s, 
                        background-color 2s 1s;
        }
        div.box:hover {
            background-color: #9009;
            height: 120px;
            width: 300px;
        }
    </style>
</head>
<body>
    <nav class="controls">
    <a href="/03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffff" viewBox="0 0 256 256">
            <path d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z">
            </path>
        </svg>
    </a>
    </nav>
    <main>
        <header>
            <h1>Transition</h1>
            <h2>Permite definir una transision entre dos estados de un elemento</h2>
        </header>
        <section>
            <h3>Example 01:</h3>
            <img class="trans1" src="../src/imgs/goku1-removebg-preview.png" width="300px">
            <h3>Example 02:</h3>
            <img class="trans2" src="../src/imgs/goku1-removebg-preview.png" width="300px">
            <h3>Example 03:</h3>
            <img class="trans3" src="../src/imgs/goku1-removebg-preview.png width="300px">
            <h3>Example 04:</h3>
            <img class="trans4" src="../src/imgs/goku1-removebg-preview.png" width="300px">
            <h3>Example 05:</h3>
            <img class="trans5" src="../src/imgs/goku1-removebg-preview.png" width="300px">
            <div class="box"></div>
        </section>  
    </main>  
</body>
</html>
