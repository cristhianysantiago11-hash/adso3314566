<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-text-shadow</title>
    <link rel="stylesheet" href="./estylos.css">
    <style>
        p.txt {
            color: #fff;
            text-align: center;
            font-size: 4rem;
            margin: 0;
        }

        p.txt1 {
            font-size: 3rem;
            text-shadow: 0px 2px 6px #333;
        }

        p.txt2 {
            text-shadow: -4px -4px 8px #333;
        }

        p.txt3 {
            text-shadow: 1px 0px 1px #888,
                0px 1px 1px #777,
                2px 1px 1px #888,
                1px 2px 1px #777,
                3px 2px 1px #888,
                2px 3px 1px #777,
                4px 3px 1px #888,
                3px 4px 1px #777,
                5px 4px 1px #888,
                4px 5px 1px #777,
                6px 5px 1px #888,
                5px 6px 1px #777,
                7px 6px 1px #888;
        }

        p.txt4 {
            letter-spacing: 0.8rem;
            text-shadow: 0px 2px 0px #dfdfdf,
                -2px 5px 0px #b8b8b8,
                -4px 8px 0px #979797,
                -6px 11px 0px #747474,
                -8px 14px 0px #565656,
                -10px 17px 0px #343434,
                -12px 20px 0px #171717,
                -14px 23px 0px #000000;
        }
    </style>
</head>

<body class="css">
    <nav>
        <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#fff" viewBox="0 0 256 256">
            <path d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path>
        </svg>
    </a>
    </nav>
    <main>
        <header>
            <h1>30-text-shadow</h1>
            <h2>Adds shadows to text.</h2>
        </header>
        <section>
            <p class="txt txt1">cristiano</p>
            <p class="txt txt2">neymar</p>
            <p class="txt txt3">messi</p>
            <p class="txt txt4">mbappe</p>
        </section>

    </main>
</body>

</html>
