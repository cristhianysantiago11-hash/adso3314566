<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-colors-alpha</title>
    <link rel="stylesheet" href="estylos.css">
<style>
        figure.mario {
            background: url(img/mario.png) no-repeat center / cover;
            border: 4px solid #fff;
            margin-block: 4rem;
            height: 380px;
            width: 380px;
            position: relative; 
        }

        figure.mario div {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: Arial;
            font-size: 14px;
        }

        figure.mario .margin {
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background-color: rgba(255, 107, 107, 0.3); 
            border: 2px dashed #ff6b6b;
        
        }
    </style>
</head>
<body>
    <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#f9f991" viewBox="0 0 256 256">
            <path d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path>
        </svg>
    </a>
    <main>
        <header>
            <h1>12-colors-alpha</h1>
            <h2>The fourth alpha channel allows you to apply opacity or transparency to the color.</h2>
            <section>
                <h3>emple transparent colors</h3>
                
            <figure class="mario">
                    <div class="margin"></div>
                
                    
                </figure>

                
            </section>
        </header>
