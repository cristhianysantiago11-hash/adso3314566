<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-percentage-units</title>
    <link rel="stylesheet" href="estylos.css">
    <style>
    main {
        width: 100%;
    }
    section.percentage {
        margin: auto;
        width: 100%;
    }
    .parent {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .parent div {
        display: flex;
        justify-content: center;
        font-size: 2rem;
        align-items: center;
        height: 50dvh;
    }
    .child1 {
        background-color: rgb(102, 255, 0);
        width: 70%;
    }
    .child2 {
        background-color: rgb(177, 118, 23);
        width: 30%;
    }
</style>
</head>
<body>
    <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#f9f991" viewBox="0 0 256 256">
                <path
                    d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                </path>
            </svg>
        </a>
        <main>
            <header>
                <h1>10-percentage-units</h1>
                <h2>
                Are relative to the size of the parent element.
                    
                </h2>
            </header>
            <section class="Percentage">
            
                <div class="parent">
                    <div class="child1">70%</div>
                    <div class="child2">30%</div>
                </div>
            </section>
        </main>
</body>
</html>
